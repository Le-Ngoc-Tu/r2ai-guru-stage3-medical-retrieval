<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1280, height=400" />
    <title>R2AI Stage 3 - README banner loop</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      :root {
        --paper-l: #fafaf8;
        --teal: #1fb5c4;
        --teal-d: #0e7c86;
        --amber: #f2a93b;
        --amber-d: #d98e04;
        --slate: #52606d;
        --graphite: #1f2933;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1280px; height: 400px; overflow: hidden; background: var(--paper-l); }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: var(--paper-l); font-family: "League Gothic", "Oswald", sans-serif; color: var(--graphite); }
      .abs { position: absolute; }
      .mono { font-family: "JetBrains Mono", monospace; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; }
      #grid { position: absolute; inset: 0; background-image: linear-gradient(rgba(14, 124, 134, 0.09) 1px, transparent 1px), linear-gradient(90deg, rgba(14, 124, 134, 0.09) 1px, transparent 1px); background-size: 32px 32px; }
      #bar { position: absolute; left: 0; top: 0; width: 12px; height: 400px; background: var(--teal-d); transform-origin: 50% 0; }
      #content { position: absolute; inset: 0; }
      .mask { position: absolute; left: 72px; overflow: hidden; height: 84px; width: 760px; }
      .mask .t { position: absolute; left: 0; top: 0; font-size: 84px; line-height: 1; letter-spacing: -0.02em; white-space: nowrap; color: var(--graphite); }
      .word { display: inline-block; }
      .chip { position: absolute; top: 336px; height: 38px; padding: 0 16px; border: 2px solid var(--teal-d); font-size: 14px; line-height: 34px; color: var(--teal-d); background: var(--paper-l); white-space: nowrap; }
      .chip.warm { border-color: var(--amber-d); color: var(--graphite); }
      .chip.warm b { color: #8f5e00; }
      #art { position: absolute; left: 836px; top: 26px; }
      .dot { position: absolute; width: 10px; height: 10px; border-radius: 50%; margin: -5px 0 0 -5px; background: var(--teal); }
      .dot.warm { background: var(--amber); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="6.4" data-width="1280" data-height="400">
      <div id="grid"></div>
      <div id="bar"></div>
      <div id="content">
        <div id="kicker" class="abs mono" style="left: 72px; top: 48px; font-size: 16px; color: var(--teal-d); letter-spacing: 0.3em">r2ai guru &middot; stage 3</div>
        <div class="mask" style="top: 76px"><div class="t" id="t1"><span class="word">TRUY</span> <span class="word">HỒI</span> <span class="word">TÀI</span> <span class="word">LIỆU</span> <span class="word">Y</span> <span class="word">KHOA</span></div></div>
        <div class="mask" style="top: 160px"><div class="t" id="t2"><span class="word">ĐA</span> <span class="word">NGÔN</span> <span class="word">NGỮ</span> <span class="word" style="color: var(--teal-d)">VIỆT</span> <span class="word">–</span> <span class="word" style="color: var(--teal-d)">TRUNG</span></div></div>
        <div id="uline" class="abs" style="left: 72px; top: 258px; width: 96px; height: 6px; background: var(--amber-d); transform-origin: 0 50%"></div>
        <div id="tag" class="abs mono" style="left: 72px; top: 288px; font-size: 14px; color: var(--slate); letter-spacing: 0.1em">bm25 + bge-m3 + rrf + cross-encoder</div>
        <div id="c1" class="chip mono warm" style="left: 72px">final <b>0.2483</b></div>
        <div id="c2" class="chip mono" style="left: 238px">7.6m chunks</div>
        <div id="c3" class="chip mono" style="left: 394px">4.39m urls</div>
        <div id="c4" class="chip mono" style="left: 540px">1 gpu &middot; 6 gb</div>
        <div id="dots"></div>
        <svg id="art" width="420" height="348" viewBox="0 0 420 348" fill="none">
          <g stroke="#0E7C86" stroke-width="6" stroke-linejoin="round" stroke-linecap="round">
            <path id="docOutline" d="M30 12 H170 L228 70 V262 H30 Z" pathLength="1" stroke-dasharray="1" fill="#FFFFFF" fill-opacity="0" />
            <path id="docFold" d="M170 12 V70 H228" pathLength="1" stroke-dasharray="1" />
            <path id="docL1" d="M62 108 H190" pathLength="1" stroke-dasharray="1" stroke-opacity="0.5" />
            <path id="docL2" d="M62 142 H190" pathLength="1" stroke-dasharray="1" stroke-opacity="0.5" />
            <path id="docL3" d="M62 176 H190" pathLength="1" stroke-dasharray="1" stroke-opacity="0.5" />
            <path id="docL4" d="M62 210 H140" pathLength="1" stroke-dasharray="1" stroke-opacity="0.5" />
          </g>
          <rect id="scan" x="52" y="98" width="148" height="20" rx="4" fill="#F2A93B" fill-opacity="0" />
          <g id="lens">
            <circle cx="218" cy="236" r="72" fill="#FFFFFF" fill-opacity="0.9" stroke="#D98E04" stroke-width="11" />
            <path d="M270 290 L332 346" stroke="#D98E04" stroke-width="17" stroke-linecap="round" />
            <path d="M182 224 H258 M182 254 H230" stroke="#0E7C86" stroke-width="7" stroke-linecap="round" stroke-opacity="0.85" />
          </g>
          <g id="bubVI"><rect x="262" y="18" width="92" height="54" rx="14" fill="#0E7C86" /><path d="M284 72 L278 92 L302 72 Z" fill="#0E7C86" /><text x="308" y="55" text-anchor="middle" font-family="JetBrains Mono" font-weight="700" font-size="26" fill="#FFFFFF">VI</text></g>
          <g id="bubZH"><rect x="6" y="276" width="92" height="54" rx="14" fill="#FFFFFF" stroke="#0E7C86" stroke-width="4" /><text x="52" y="312" text-anchor="middle" font-family="Noto Sans JP" font-weight="700" font-size="26" fill="#0E7C86">中文</text></g>
        </svg>
      </div>
    </div>
    <script>
      (function () {
        function mulberry32(a) {
          return function () {
            a |= 0; a = (a + 0x6d2b79f5) | 0;
            let t = Math.imul(a ^ (a >>> 15), 1 | a);
            t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
            return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
          };
        }
        const rand = mulberry32(412);
        const $ = (s) => document.querySelector(s);
        document.fonts.ready.then(function () {
          const tl = gsap.timeline({ paused: true });
          const END = 6.4, EXIT = 5.8;

          /* nền + thanh bên */
          tl.fromTo("#grid", { opacity: 0 }, { opacity: 1, duration: 0.6, ease: "power2.out" }, 0);
          tl.fromTo("#bar", { scaleY: 0 }, { scaleY: 1, duration: 0.7, ease: "power4.out" }, 0);

          /* chữ: waterfall */
          tl.fromTo("#kicker", { opacity: 0, x: -24 }, { opacity: 1, x: 0, duration: 0.45, ease: "power3.out" }, 0.12);
          tl.fromTo("#t1 .word", { yPercent: 125 }, { yPercent: 0, duration: 0.55, ease: "power4.out", stagger: 0.05 }, 0.2);
          tl.fromTo("#t2 .word", { yPercent: 125 }, { yPercent: 0, duration: 0.55, ease: "power4.out", stagger: 0.05 }, 0.42);
          tl.fromTo("#uline", { scaleX: 0 }, { scaleX: 1, duration: 0.5, ease: "power4.out" }, 0.8);
          tl.fromTo("#tag", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, 0.95);
          tl.fromTo(["#c1", "#c2", "#c3", "#c4"], { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.45, ease: "back.out(1.8)", stagger: 0.09 }, 1.1);

          /* hình minh họa */
          tl.fromTo("#docOutline", { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: 0.7, ease: "power2.inOut" }, 0.2);
          tl.fromTo("#docOutline", { fillOpacity: 0 }, { fillOpacity: 1, duration: 0.4 }, 0.65);
          tl.fromTo(["#docFold", "#docL1", "#docL2", "#docL3", "#docL4"], { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: 0.35, ease: "power2.out", stagger: 0.07 }, 0.6);
          tl.fromTo("#lens", { scale: 0, rotation: -30, svgOrigin: "218 236", opacity: 0 }, { scale: 1, rotation: 0, opacity: 1, duration: 0.6, ease: "back.out(1.8)" }, 0.85);
          tl.fromTo("#bubVI", { scale: 0, svgOrigin: "308 45" }, { scale: 1, duration: 0.5, ease: "back.out(2.4)" }, 1.05);
          tl.fromTo("#bubZH", { scale: 0, svgOrigin: "52 303" }, { scale: 1, duration: 0.5, ease: "back.out(2.4)" }, 1.2);

          /* chấm "kết quả" quanh hình, bật lần lượt */
          const dotsEl = $("#dots");
          const dots = [];
          for (let i = 0; i < 14; i++) {
            const d = document.createElement("div");
            d.className = "dot" + (i % 4 === 0 ? " warm" : "");
            const ang = rand() * Math.PI * 2, rad = 150 + rand() * 120;
            d.style.left = 1046 + Math.cos(ang) * rad * 1.05 + "px";
            d.style.top = 200 + Math.sin(ang) * rad * 0.62 + "px";
            dotsEl.appendChild(d); dots.push(d);
          }
          tl.fromTo(dots, { scale: 0, opacity: 0 }, { scale: 1, opacity: 0.9, duration: 0.35, ease: "back.out(3)", stagger: 0.07 }, 1.3);
          tl.to(dots, { scale: 1.6, duration: 0.7, ease: "sine.inOut", yoyo: true, repeat: 3, stagger: { each: 0.12, repeat: 0 } }, 2.4);

          /* ambient: quét tài liệu, kính lúp lượn, bong bóng nổi (chu kỳ hữu hạn) */
          tl.fromTo("#scan", { y: 0, fillOpacity: 0 }, { y: 0, fillOpacity: 0.34, duration: 0.2, ease: "none" }, 1.7);
          [0, 34, 68, 102, 68, 34, 0].forEach(function (yy, i) {
            tl.to("#scan", { y: yy, duration: 0.5, ease: "power2.inOut" }, 1.9 + i * 0.5);
          });
          tl.to("#scan", { fillOpacity: 0, duration: 0.2 }, 5.3);
          tl.to("#lens", { x: -22, y: -34, duration: 1.7, ease: "sine.inOut", yoyo: true, repeat: 1 }, 1.7);
          tl.to("#bubVI", { y: -8, duration: 1.0, ease: "sine.inOut", yoyo: true, repeat: 3 }, 1.7);
          tl.to("#bubZH", { y: 8, duration: 1.0, ease: "sine.inOut", yoyo: true, repeat: 3 }, 1.9);

          /* thoát nhanh để vòng lặp sạch */
          tl.to("#content", { opacity: 0, duration: 0.5, ease: "power2.in" }, EXIT);
          tl.to("#grid", { opacity: 0.3, duration: 0.5 }, EXIT);
          window.__timelines["main"] = tl;
        });
      })();
    </script>
  </body>
</html>
