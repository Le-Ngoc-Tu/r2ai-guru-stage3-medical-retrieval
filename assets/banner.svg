<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-labelledby="t d">
  <title id="t">R2AI GURU Stage 3 - Truy hồi tài liệu y khoa đa ngôn ngữ</title>
  <desc id="d">Banner dự án: truy hồi tài liệu y khoa tiếng Việt và tiếng Trung trên một GPU 6 GB</desc>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#0E7C86" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1280" height="400" fill="#FAFAF8"/>
  <rect width="1280" height="400" fill="url(#grid)"/>
  <rect x="0" y="0" width="12" height="400" fill="#0E7C86"/>

  <text x="72" y="108" font-family="Georgia, 'DejaVu Serif', 'Times New Roman', serif" font-size="22" letter-spacing="6" fill="#0E7C86">R2AI GURU · STAGE 3</text>
  <text x="72" y="190" font-family="Georgia, 'DejaVu Serif', 'Times New Roman', serif" font-size="58" font-weight="700" fill="#1F2933">Truy hồi tài liệu y khoa</text>
  <text x="72" y="256" font-family="Georgia, 'DejaVu Serif', 'Times New Roman', serif" font-size="58" font-weight="700" fill="#1F2933">đa ngôn ngữ Việt – Trung</text>
  <rect x="72" y="282" width="120" height="5" fill="#D98E04"/>
  <text x="72" y="330" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="22" fill="#52606D">BM25 + BGE-M3 + RRF + cross-encoder · 4,39 triệu URL · một GPU RTX 3050 6 GB</text>

  <!-- tài liệu -->
  <g transform="translate(860 70)" fill="none" stroke="#0E7C86" stroke-width="5" stroke-linejoin="round" stroke-linecap="round">
    <path d="M10 0h120l50 50v210H10z" fill="#FFFFFF"/>
    <path d="M130 0v50h50"/>
    <path d="M40 90h110M40 125h110M40 160h110M40 195h70" stroke-opacity="0.55"/>
  </g>
  <!-- kính lúp -->
  <g transform="translate(960 150)" fill="none" stroke-linecap="round">
    <circle cx="70" cy="70" r="62" fill="#FFFFFF" fill-opacity="0.85" stroke="#D98E04" stroke-width="9"/>
    <path d="M116 116l62 62" stroke="#D98E04" stroke-width="14"/>
    <path d="M38 62h64M38 88h42" stroke="#0E7C86" stroke-width="6" stroke-opacity="0.8"/>
  </g>
  <!-- bong bóng ngôn ngữ -->
  <g font-family="'Segoe UI', 'Noto Sans CJK SC', 'Microsoft YaHei', 'DejaVu Sans', sans-serif" font-size="26" font-weight="700">
    <g transform="translate(1085 62)">
      <rect width="108" height="64" rx="16" fill="#0E7C86"/>
      <path d="M26 64l-4 22 24-22z" fill="#0E7C86"/>
      <text x="54" y="42" text-anchor="middle" fill="#FFFFFF">VI</text>
    </g>
    <g transform="translate(1100 300)">
      <rect width="108" height="64" rx="16" fill="#FFFFFF" stroke="#0E7C86" stroke-width="4"/>
      <path d="M80 64l4 22-24-22z" fill="#FFFFFF" stroke="#0E7C86" stroke-width="4" stroke-linejoin="round"/>
      <rect x="52" y="58" width="32" height="10" fill="#FFFFFF"/>
      <text x="54" y="42" text-anchor="middle" fill="#0E7C86">中文</text>
    </g>
  </g>
</svg>
